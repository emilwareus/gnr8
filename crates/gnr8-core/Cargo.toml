[package]
name = "gnr8"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Code-first API extraction to OpenAPI 3.1 and generated client SDKs"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
# serde_json deserializes the goextract JSON facts (analyze::facts), serializes the artifact bundle
# the runner emits / the host parses, and is the source error type for CoreError::FactsParse. Pinned
# via [workspace.dependencies] (1.0).
serde_json = { workspace = true }
# Parse Python package metadata semantically so equivalent PEP 621 table layouts compare equally.
toml = { workspace = true }
# noyalib parses JSON/YAML OpenAPI source artifacts behind the OpenApi Source seam only.
noyalib = { workspace = true }
# blake3 hashes generated outputs for the ownership manifest + no-op detection (manifest/
# lifecycle, 04-02). Pinned via [workspace.dependencies] (1.8); a stable, collision-resistant
# content fingerprint (NOT std DefaultHasher, which is not stable across toolchains — RESEARCH
# Pitfall 4). First consumer is this plan's manifest module (PLAN-CHECK W1).
blake3 = { workspace = true }
# Bounded filesystem safety primitives: capability-relative directory handles plus no-follow opens
# prevent generated output paths from escaping the project root through symlink races.
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }
# Cross-platform advisory locks serialize transaction/recovery within one output directory.
fs2 = { workspace = true }
# Bounded text primitives used only to define a deterministic, portable artifact-path identity.
unicode-normalization = { workspace = true }
unicode-casefold = { workspace = true }
# Safe wrappers for atomic rename-without-replacement on supported Unix kernels.
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# NOTE: the ergonomic binary-boundary error crate is intentionally absent here —
# it lives only in the gnr8 binary (D-09). Library code uses thiserror typed errors.

[dev-dependencies]
insta = { workspace = true }
