name: generated-sdk-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Same reason as ci.yml: skipping the registry audit round-trip is what keeps the
# TypeScript sidecar restore inside the five-minute budget.
env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

concurrency:
  group: generated-sdk-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    name: Build check binary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: generated-sdk-binary

      - name: Build gnr8
        run: cargo build --release -p gnr8-cli --locked

      - uses: actions/upload-artifact@v6
        with:
          name: generated-sdk-check-binary
          path: target/release/gnr8
          if-no-files-found: error
          retention-days: 1

  check-example:
    name: Check ${{ matrix.project }}
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # `report_changes` runs the action's changes mode against the real binary. One project is
          # enough — that path is language-agnostic — and one keeps the pull-request comment step
          # from racing five jobs over the same marker comment.
          - project: bookstore
            setup_go: "true"
            setup_python: "false"
            setup_node: "false"
            report_changes: "true"
          - project: taskflow
            setup_go: "true"
            setup_python: "false"
            setup_node: "false"
            report_changes: "false"
          - project: fastapi-bookstore
            setup_go: "false"
            setup_python: "true"
            setup_node: "false"
            report_changes: "false"
          - project: flask-bookstore
            setup_go: "false"
            setup_python: "true"
            setup_node: "false"
            report_changes: "false"
          - project: nestjs-bookstore
            setup_go: "false"
            setup_python: "false"
            setup_node: "true"
            report_changes: "false"
    steps:
      # Change reporting reads the base revision's committed graph artifact out of history, which
      # is the `fetch-depth: 0` the action documents for its callers.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          name: generated-sdk-check-binary
          path: target/release

      - name: Make gnr8 executable
        run: chmod +x target/release/gnr8

      - uses: actions/setup-node@v6
        if: matrix.setup_node == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tsextract/package-lock.json

      - name: Restore TypeScript sidecar dependency
        if: matrix.setup_node == 'true'
        run: npm ci --silent
        working-directory: tsextract

      - name: Check committed generated artifacts
        uses: ./
        env:
          GNR8_RESOURCE_DIR: ${{ github.workspace }}
        with:
          working-directories: examples/${{ matrix.project }}
          gnr8-binary: ${{ github.workspace }}/target/release/gnr8
          setup-go: ${{ matrix.setup_go }}
          go-version: "1.27"
          setup-python: ${{ matrix.setup_python }}
          python-version: "3.13"
          setup-node: "false"
          node-version: "24"
          cache-key-prefix: gnr8-${{ matrix.project }}
          # The workflow token is contents:read, so the action's pull-request comment step cannot
          # post and degrades to its documented warning. That is deliberate: this repository's own
          # pull requests do not want the comment, and the report still reaches the job summary and
          # the uploaded artifact, which is what this job asserts the composite path produces.
          report-api-changes: ${{ matrix.report_changes }}
          # HEAD, not origin/main: the base must already carry the committed graph artifact this
          # release introduces, and main does not until this branch merges. HEAD asserts that the
          # committed artifact matches a fresh projection, which is deterministic before and after
          # the merge; switch it to origin/main once main carries the artifacts.
          base-ref: HEAD

  check:
    name: gnr8 check
    needs: [build-cli, check-example]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the binary and every example
        env:
          BUILD_RESULT: ${{ needs.build-cli.result }}
          EXAMPLE_RESULT: ${{ needs.check-example.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$EXAMPLE_RESULT" = success
