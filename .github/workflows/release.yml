# One-shot release: prepare and validate the version-only commit, then atomically push main +
# vX.Y.Z before optional publication and release assets. Main's focused CI jobs own test coverage.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Version bump level. Use "minor" whenever the release removes or changes public API:
          Cargo treats 0.x.y -> 0.x.(y+1) as compatible, so a patch bump would push a breaking
          change to every downstream `gnr8 = "0.1"` silently.
        type: choice
        options: [patch, minor]
        default: patch
      publish_crates:
        description: Publish the public gnr8 crate to crates.io after tag
        type: boolean
        default: true
      publish_cli:
        description: Build CLI and upload archives to the GitHub Release for this tag
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-and-tag:
    name: Prepare and tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' && secrets.WORKFLOW_PUSH_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync main
        run: git pull --rebase origin main

      - name: Validate release selections
        env:
          PUBLISH_CRATES: ${{ inputs.publish_crates }}
          PUBLISH_CLI: ${{ inputs.publish_cli }}
        run: |
          if [[ "$PUBLISH_CLI" = true && "$PUBLISH_CRATES" != true ]]; then
            echo "::error::CLI archives require the exact gnr8 crate version to be published first."
            exit 1
          fi

      - name: Bump release version
        id: bump
        run: |
          if [ "${{ inputs.bump }}" = "minor" ]; then
            new="$(python3 scripts/bump-workspace-version.py --minor)"
          else
            new="$(python3 scripts/bump-workspace-version.py)"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Validate release changelog
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: python3 scripts/release-notes.py check "$NEW_VERSION"

      - name: Refresh Cargo.lock
        run: cargo check --workspace

      - name: Refresh committed example lockfiles
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          find examples -path '*/.gnr8/Cargo.toml' -print0 |
            while IFS= read -r -d '' manifest; do
              cargo update \
                --manifest-path "$manifest" \
                -p gnr8 \
                --precise "$NEW_VERSION"
            done

      - name: Create version commit locally
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock 'examples/*/.gnr8/Cargo.lock'
          if git diff --staged --quiet; then
            echo "::error::No version changes to commit."
            exit 1
          fi
          git commit -m "chore(release): bump crate version to ${NEW_VERSION}"

      - name: Verify version update is complete
        run: git diff --exit-code

      - name: Atomically push versioned commit and tag
        id: metadata
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${NEW_VERSION}"
          git tag -a "${TAG}" -m "gnr8 ${NEW_VERSION}"
          git push --atomic origin HEAD:main "refs/tags/${TAG}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  crates-io:
    name: Publish crates.io
    needs: bump-and-tag
    if: github.ref == 'refs/heads/main' && inputs.publish_crates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CRATES_IO_TOKEN:-}" ]]; then
            echo "::error::CRATES_IO_TOKEN is not set."
            exit 1
          fi
          ./scripts/publish-crates.sh

  build-cli:
    name: CLI ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    needs: bump-and-tag
    if: github.ref == 'refs/heads/main' && inputs.publish_cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            asset_os: macos
            asset_arch: aarch64
            target: aarch64-apple-darwin
          - runner: windows-latest
            asset_os: windows
            asset_arch: x86_64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}

      - name: Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and package gnr8
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: scripts/package-release.sh

      - uses: actions/upload-artifact@v6
        with:
          name: gnr8-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: target/release-local-dist/dist/*
          if-no-files-found: error

  github-release-cli:
    name: GitHub Release assets
    needs: [bump-and-tag, crates-io, build-cli]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_cli &&
      needs.bump-and-tag.result == 'success' &&
      needs.crates-io.result == 'success' &&
      needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump-and-tag.outputs.tag }}
          VERSION: ${{ needs.bump-and-tag.outputs.version }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No artifacts in dist/"
            exit 1
          fi
          python3 scripts/release-notes.py body "${VERSION}" --repo "${REPO}" > release-notes.md
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --repo "${REPO}" --clobber
            gh release edit "${TAG}" \
              --repo "${REPO}" \
              --title "gnr8 ${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" "${files[@]}" \
              --repo "${REPO}" \
              --title "gnr8 ${VERSION}" \
              --notes-file release-notes.md
          fi
